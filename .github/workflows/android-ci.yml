name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel obsolete builds for the same branch so the latest commit gets CI priority.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Android 17 API 37.1 is published as the CANARY platform package.
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 --install "platforms;android-CANARY" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
